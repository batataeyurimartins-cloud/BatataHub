<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo • Batata Games</title>
  <meta name="description" content="Página individual de jogo do Batata Games.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="stars"></canvas>
  <div class="noise"></div>
  <div class="cursor-glow" id="cursorGlow"></div>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <header class="site-header">
    <nav class="nav container">
      <a href="index.html" class="brand">
        <span class="brand-icon"></span>
        <span>Batata Games</span>
      </a>

      <button class="menu-btn" id="menuBtn" aria-label="Abrir menu">☰</button>

      <div class="nav-links" id="navLinks">
        <a href="../index.html">Hub</a>
        <a href="../scripts.html">Scripts</a>
        <a href="../games.html">Games</a>
        <a href="index.html">Início</a>
        <a href="jogos.html">Jogos</a>
      </div>
    </nav>
  </header>

  <main class="tutorial-page-wrap container game-page-wrap">
    <a class="back-link" href="jogos.html">← Voltar para jogos</a>

    <section class="game-layout">
      <aside class="tutorial-page-card reveal game-info-card" id="gameInfo"></aside>

      <section class="tutorial-page-card reveal game-player-card">
        <div class="player-head">
          <div>
            <span class="section-tag">Player</span>
            <h2>Jogar agora</h2>
            <p>Se o jogo falhar, quase sempre o erro é do link externo.</p>
          </div>
          <div class="hero-actions player-actions">
            <button class="btn btn-secondary" id="fullscreenBtn" type="button">Tela cheia</button>
            <a class="btn btn-primary" id="openExternalBtn" href="#" target="_blank" rel="noopener noreferrer">Abrir original</a>
          </div>
        </div>

        <div class="player-box" id="playerBox">
          <iframe id="gameFrame" title="Game frame" loading="lazy" allowfullscreen referrerpolicy="no-referrer"></iframe>
        </div>
      </section>
    </section>
  </main>

  <footer class="footer container">
    <p>Batata Games © 2026 • Player de jogos</p>
  </footer>

  <script src="js/games.js"></script>
  <script src="js/script.js"></script>
  <script src="js/jogo.js"></script>
</body>
</html>
